[project]
name = "carelake"
version = "0.1.0"
description = "Synthetic healthcare data engineering platform (S3, Snowflake, dbt, Airflow)"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
aws = ["boto3>=1.34"]
snowflake = ["snowflake-connector-python>=3.12", "cryptography>=42"]
local = ["duckdb>=1.0", "dbt-duckdb>=1.8"]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/carelake"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
